AWSTemplateFormatVersion: '2010-09-09'
Description: AWS CloudFormation Template for Development Environment

Parameters:
  S3AppBucket:
    Type: String
    Description: S3 bucket where application zips are stored
  AmplifyBucket:
    Type: String
    Description: S3 bucket for Amplify static hosting
  VPNUsername:
    Type: String
  VPNPassword:
    Type: String

Tags:
  - Key: dev-deploy-script
    Value: '0'

Resources:

  # VPC and Networking
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      Tags:
        - Key: dev-deploy-script
          Value: '0'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: dev-deploy-script
          Value: '0'

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref VPC

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: dev-deploy-script
          Value: '0'

  PublicRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  # Public Subnets
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [ 0, !GetAZs "" ]
      Tags:
        - Key: dev-deploy-script
          Value: '0'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.3.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [ 1, !GetAZs "" ]
      Tags:
        - Key: dev-deploy-script
          Value: '0'

  PublicSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.5.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select [ 2, !GetAZs "" ]
      Tags:
        - Key: dev-deploy-script
          Value: '0'

  # Private Subnets
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [ 0, !GetAZs "" ]
      Tags:
        - Key: dev-deploy-script
          Value: '0'

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.4.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [ 1, !GetAZs "" ]
      Tags:
        - Key: dev-deploy-script
          Value: '0'

  PrivateSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.6.0/24
      MapPublicIpOnLaunch: false
      AvailabilityZone: !Select [ 2, !GetAZs "" ]
      Tags:
        - Key: dev-deploy-script
          Value: '0'

  # Elastic Beanstalk Applications and Environments
  InfluxDBApp:
    Type: AWS::ElasticBeanstalk::Application
    Properties:
      ApplicationName: influxdb
      Tags:
        - Key: dev-deploy-script
          Value: '0'

  InfluxDBEnv:
    Type: AWS::ElasticBeanstalk::Environment
    Properties:
      EnvironmentName: influxdb-env
      ApplicationName: !Ref InfluxDBApp
      SolutionStackName: "64bit Amazon Linux 2 v5.8.4 running Docker"
      OptionSettings:
        - Namespace: aws:autoscaling:launchconfiguration
          OptionName: InstanceType
          Value: m5.large
        - Namespace: aws:ec2:vpc
          OptionName: Subnets
          Value: !Join [",", [!Ref PrivateSubnet1, !Ref PrivateSubnet2, !Ref PrivateSubnet3]]
        - Namespace: aws:elasticbeanstalk:container:docker
          OptionName: DockerImage
          Value: influxdb:2.7.11
      Tags:
        - Key: dev-deploy-script
          Value: '0'

  RabbitMQApp:
    Type: AWS::ElasticBeanstalk::Application
    Properties:
      ApplicationName: rabbitmq
      Tags:
        - Key: dev-deploy-script
          Value: '0'

  RabbitMQEnv:
    Type: AWS::ElasticBeanstalk::Environment
    Properties:
      EnvironmentName: rabbitmq-env
      ApplicationName: !Ref RabbitMQApp
      SolutionStackName: "64bit Amazon Linux 2 v5.8.4 running Docker"
      OptionSettings:
        - Namespace: aws:autoscaling:launchconfiguration
          OptionName: InstanceType
          Value: m5.large
        - Namespace: aws:ec2:vpc
          OptionName: Subnets
          Value: !Join [",", [!Ref PublicSubnet1, !Ref PublicSubnet2, !Ref PrivateSubnet1, !Ref PrivateSubnet2]]
        - Namespace: aws:elasticbeanstalk:container:docker
          OptionName: DockerImage
          Value: rabbitmq:4.1.0-management
      Tags:
        - Key: dev-deploy-script
          Value: '0'

  DataProcApp:
    Type: AWS::ElasticBeanstalk::Application
    Properties:
      ApplicationName: data-proc
      Tags:
        - Key: dev-deploy-script
          Value: '0'

  DataProcEnv:
    Type: AWS::ElasticBeanstalk::Environment
    Properties:
      EnvironmentName: data-proc-env
      ApplicationName: !Ref DataProcApp
      SolutionStackName: "64bit Amazon Linux 2 v5.8.4 running Docker"
      OptionSettings:
        - Namespace: aws:autoscaling:launchconfiguration
          OptionName: InstanceType
          Value: m5.large
        - Namespace: aws:autoscaling:asg
          OptionName: MinSize
          Value: "1"
        - Namespace: aws:autoscaling:asg
          OptionName: MaxSize
          Value: "5"
        - Namespace: aws:ec2:vpc
          OptionName: Subnets
          Value: !Join [",", [!Ref PrivateSubnet1, !Ref PrivateSubnet2, !Ref PrivateSubnet3]]
      Tags:
        - Key: dev-deploy-script
          Value: '0'

  FrontSrvApp:
    Type: AWS::ElasticBeanstalk::Application
    Properties:
      ApplicationName: front-srv
      Tags:
        - Key: dev-deploy-script
          Value: '0'

  FrontSrvEnv:
    Type: AWS::ElasticBeanstalk::Environment
    Properties:
      EnvironmentName: front-srv-env
      ApplicationName: !Ref FrontSrvApp
      SolutionStackName: "64bit Amazon Linux 2 v5.8.4 running Docker"
      OptionSettings:
        - Namespace: aws:autoscaling:launchconfiguration
          OptionName: InstanceType
          Value: m5.large
        - Namespace: aws:autoscaling:asg
          OptionName: MinSize
          Value: "1"
        - Namespace: aws:autoscaling:asg
          OptionName: MaxSize
          Value: "5"
        - Namespace: aws:ec2:vpc
          OptionName: Subnets
          Value: !Join [",", [!Ref PublicSubnet1, !Ref PublicSubnet2, !Ref PublicSubnet3]]
        - Namespace: aws:elasticbeanstalk:container:docker
          OptionName: DockerImage
          Value: nodejs:lts
      Tags:
        - Key: dev-deploy-script
          Value: '0'

# API Gateway Resources
  APIGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: FrontSrvAPI
      Tags:
        - Key: dev-deploy-script
          Value: '0'

  LoginResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt APIGateway.RootResourceId
      PathPart: login
      RestApiId: !Ref APIGateway

  LogoutResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt APIGateway.RootResourceId
      PathPart: logout
      RestApiId: !Ref APIGateway

  StatusResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt APIGateway.RootResourceId
      PathPart: status
      RestApiId: !Ref APIGateway

  LogsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt APIGateway.RootResourceId
      PathPart: logs
      RestApiId: !Ref APIGateway

  LoginMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: POST
      ResourceId: !Ref LoginResource
      RestApiId: !Ref APIGateway
      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "http://${FrontSrvEnv}.elasticbeanstalk.com/api/login"

  LogoutMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: POST
      ResourceId: !Ref LogoutResource
      RestApiId: !Ref APIGateway
      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "http://${FrontSrvEnv}.elasticbeanstalk.com/api/logout"

  StatusMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: GET
      ResourceId: !Ref StatusResource
      RestApiId: !Ref APIGateway
      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: GET
        Uri: !Sub "http://${FrontSrvEnv}.elasticbeanstalk.com/api/status"

  LogsMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: POST
      ResourceId: !Ref LogsResource
      RestApiId: !Ref APIGateway
      Integration:
        Type: HTTP_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub "http://${FrontSrvEnv}.elasticbeanstalk.com/api/logs"

  # Route 53 for front_srv and amplify
  FrontSrvRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: example.com.
      Name: api.example.com.
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2 # AWS ELB zone ID (could vary)
        DNSName: !GetAtt FrontSrvEnv.EndpointURL

  AmplifyRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneName: example.com.
      Name: static.example.com.
      Type: A
      AliasTarget:
        HostedZoneId: Z2FDTNDATAQYW2 # AWS Amplify hosting zone ID (could vary)
        DNSName: !Sub "${AmplifyAppName}.amplifyapp.com"

  HostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: example.com
      HostedZoneConfig:
        Comment: Domain for dev environment

Outputs:
  VPCId:
    Value: !Ref VPC
  PublicSubnet1Id:
    Value: !Ref PublicSubnet1
  PrivateSubnet1Id:
    Value: !Ref PrivateSubnet1
